name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: workforce-intelligence

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: workforce-intelligence/apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (real-bug subset)
        working-directory: workforce-intelligence/apps/api
        run: ruff check --select E9,F63,F7,F82 .
      - name: Migrations smoke (SQLite)
        working-directory: workforce-intelligence/apps/api
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: alembic upgrade head
      - name: Tests
        working-directory: workforce-intelligence/apps/api
        run: pytest -q

  extension:
    name: Browser extension (build + typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: workforce-intelligence/apps/browser-extension
        run: npm ci || npm install
      - name: Typecheck
        working-directory: workforce-intelligence/apps/browser-extension
        run: npm run typecheck
      - name: Build
        working-directory: workforce-intelligence/apps/browser-extension
        run: npm run build
      - name: Redaction tests
        working-directory: workforce-intelligence/apps/browser-extension
        run: npm test

  dashboard:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: workforce-intelligence/apps/dashboard
        run: npm ci || npm install
      - name: Typecheck
        working-directory: workforce-intelligence/apps/dashboard
        run: npm run typecheck
      - name: Build
        working-directory: workforce-intelligence/apps/dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
