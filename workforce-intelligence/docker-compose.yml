services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wfi_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-workforce_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wfi} -d ${POSTGRES_DB:-workforce_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      # Inside the compose network, reach services by name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wfi}:${POSTGRES_PASSWORD:-wfi_dev_password_change_me}@db:5432/${POSTGRES_DB:-workforce_intelligence}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Apply migrations, seed demo data, then serve.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  dashboard:
    build:
      context: ./apps/dashboard
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
